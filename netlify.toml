[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  included_files = ["app/api/surge/**"]

[functions."api/surge/launch"]
  timeout = 60

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/.well-known/agent.json"
  to = "/api/well-known/agent-card.json"
  status = 200
  force = true

[dev]
  command = "npm run dev"
  port = 3000
