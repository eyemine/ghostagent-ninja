name: Publish @ghost-agency/nftmail

on:
  push:
    tags:
      - 'nftmail-v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@ghost-agency'

      - name: Install dependencies
        run: npm ci
        working-directory: packages/nftmail

      - name: Build
        run: npm run build
        working-directory: packages/nftmail

      - name: Publish to GitHub Packages
        run: npm publish
        working-directory: packages/nftmail
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
