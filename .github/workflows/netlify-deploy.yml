name: Deploy to Netlify

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ghostAgentNinja
    # Skip deploys triggered by the automated warrant canary commits
    if: "!contains(github.event.head_commit.message, 'chore: warrant canary')"
    steps:
      - name: Trigger Netlify build
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.NETLIFY_AUTH_TOKEN }}" \
            "https://api.netlify.com/api/v1/sites/0c72c601-fc80-4f63-bf53-2991562dac80/builds"
