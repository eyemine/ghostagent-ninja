name = "nftmail-email-ingest"
main = "index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[[email]]
name = "email-ingest"

[[kv_namespaces]]
binding = "MAIL_KV"
id = "REPLACE_WITH_YOUR_KV_ID"
preview_id = "REPLACE_WITH_YOUR_KV_PREVIEW_ID"

[vars]
NEXTJS_BASE_URL = "https://ghostagent.ninja"

