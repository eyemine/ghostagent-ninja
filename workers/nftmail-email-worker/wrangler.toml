name = "nftmail-email-worker"
main = "src/index.ts"
compatibility_date = "2026-02-15"

[vars]
BACKEND = "KV"
SURGE_TOKEN = "0xFc0d6D124dF2bF30c070D0965cf4E575AE0117c7"
GHOST_REGISTRY = "0x73F2d7f43B3aa98D434F53e921d3A41aa570bE13"

[[kv_namespaces]]
binding = "INBOX_KV"
id = "d2177071c3fb4c48a1a22b36ee1a1baf"

[[kv_namespaces]]
binding = "GHOST_CALENDAR"
id = "124768a09cbb48d08bb0a1893f3d2003"

# D1 — PUPA+ relational store (agents, emails, tier_history, identities, memory, shared_context)
# Create with: npx wrangler d1 create nftmail-db
# Then replace database_id below with the output ID.
[[d1_databases]]
binding      = "NFTMAIL_DB"
database_name = "nftmail-db"
database_id  = "REPLACE_WITH_D1_DATABASE_ID"

# Zoho Mail polling: every 5 min, fetch unread → ECIES encrypt → delete cleartext
# Max cleartext exposure window: 5 minutes
# Weekly agent report: every Monday at 09:00 UTC
[triggers]
crons = ["*/5 * * * *", "0 9 * * 1"]
